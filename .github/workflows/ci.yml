name: Verify schemas

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    # Python's lazily built validators spend 8 to 13 minutes on the flat corpus here.
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '24']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: npm ci
      - run: python -m venv .venv
      - run: .venv/bin/python -m pip install -r requirements-test.txt
      - run: npm test
      - run: npm run check:examples
      # The corpora are deterministic, so one Node version's copy suffices for Python.
      - if: matrix.node == '24'
        run: npm run check:python
      - if: matrix.node == '24'
        run: npm run check:tally
      - run: npm run demo
      - run: .venv/bin/python examples/validate.py
      - run: npm run build
      - name: Check the source package and documentation links
        run: python scripts/package.py

  handoff:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Download from the playground and validate in a clean Python environment
        run: npm run check:handoff
